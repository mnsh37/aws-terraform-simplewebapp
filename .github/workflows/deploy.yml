name: Provision and Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init and Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Get EC2 IP Address
        working-directory: ./terraform
        id: get-ip
        run: echo "PROD_IP=$(terraform output -raw server_public_ip)" >> $GITHUB_ENV

      - name: Wait for EC2 to boot
        run: sleep 30 # Gives the new server time to start up and run the Nginx install script

      - name: Deploy Web App via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.PROD_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "index.html"
          target: "/var/www/html/"